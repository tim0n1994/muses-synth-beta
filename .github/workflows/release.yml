name: Build release assets (no publication)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact version tag (vPACKAGE_VERSION)
        required: true
        type: string
      sha:
        description: Full 40-character SHA bound to that tag and this workflow run
        required: true
        type: string
      authorized:
        description: Confirm authorization to generate assets; publishing is a separate operation
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on unauthorized or mismatched run
        env:
          AUTHORIZED: ${{ inputs.authorized }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          test "$AUTHORIZED" = true
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SHA" = "$GITHUB_SHA"
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
  gates:
    needs: binding
    uses: ./.github/workflows/ci.yml
  assets:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.x"
          cache: false
      - run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm build
      - name: Package exact authorized checkout
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: pnpm release:package --tag "$TAG" --sha "$SHA" --out "${RUNNER_TEMP}/release-assets"
      - run: pnpm release:smoke "${RUNNER_TEMP}/release-assets" "${RUNNER_TEMP}/release-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-synth-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
