name: Public synth beta CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm test:release
      - run: pnpm check:public
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.x"
          cache: false
      - run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm check:secrets
      - run: pnpm audit:prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:media
      - run: pnpm build
      - run: pnpm release:package --local-preview --out "${RUNNER_TEMP}/compiled-preview"
      - run: pnpm release:smoke "${RUNNER_TEMP}/compiled-preview" "${RUNNER_TEMP}/smoke-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-synth-preview
          path: ${{ runner.temp }}/compiled-preview/*
          if-no-files-found: error
          retention-days: 7
